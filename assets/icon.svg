<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Rounak Adhikary">
  <title>Rounak Adhikary</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset=".55" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#f0a800"/>
    </linearGradient>
  </defs>

  <!-- newsprint ground -->
  <rect width="512" height="512" rx="58" fill="#f4efe2"/>

  <!-- burst: two squares 45° apart, the classic comic star -->
  <g stroke="#141414" stroke-width="14" stroke-linejoin="round">
    <rect x="82" y="82" width="348" height="348" fill="#e62429"/>
    <rect x="82" y="82" width="348" height="348" fill="url(#sheen)" transform="rotate(45 256 256)"/>
  </g>

  <!-- printed halftone shading -->
  <g fill="#141414" fill-opacity=".2">
    <circle cx="392" cy="392" r="7"/><circle cx="424" cy="392" r="7"/>
    <circle cx="392" cy="424" r="7"/><circle cx="424" cy="424" r="7"/>
    <circle cx="392" cy="360" r="7"/><circle cx="424" cy="360" r="7"/>
  </g>

  <circle cx="256" cy="248" r="146" fill="#fffdf6" stroke="#141414" stroke-width="14"/>
  <text x="256" y="308" text-anchor="middle" font-family="Impact, 'Arial Black', 'Arial Narrow Bold', sans-serif"
        font-size="176" font-weight="bold" fill="#141414" letter-spacing="2">RA</text>

  <g transform="rotate(-6 256 410)">
    <rect x="112" y="382" width="288" height="60" fill="#1d4fd8" stroke="#141414" stroke-width="11"/>
    <text x="256" y="426" text-anchor="middle" font-family="Impact, 'Arial Black', 'Arial Narrow Bold', sans-serif"
          font-size="36" fill="#fffdf6" letter-spacing="4">ISSUE #07</text>
  </g>

  <path d="M416 96 L388 156 L416 150 L386 224 L442 146 L412 152 L436 96 Z"
        fill="#ffd400" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>
</svg>

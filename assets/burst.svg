    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(37.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(52.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(67.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(82.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(97.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(112.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(127.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(142.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(157.5)"/>

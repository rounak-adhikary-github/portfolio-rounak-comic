<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="-360 -360 720 720" role="img" aria-label="Comic starburst with speed lines">
  <title>Comic starburst</title>
  <!-- Built from wedges rather than one huge polygon so it stays readable:
      twelve long spikes, twelve short ones between them, then radial speed
      lines. Fades out at the edges so it sits behind type without fighting it. -->
  <g fill="#141414" fill-opacity="0.13">
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(0)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(30)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(60)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(90)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(120)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(150)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(180)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(210)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(240)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(270)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(300)"/>
    <path d="M0 0 L-16 -358 L16 -358 Z" transform="rotate(330)"/>
  </g>
  <g fill="#141414" fill-opacity="0.07">
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(15)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(45)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(75)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(105)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(135)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(165)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(195)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(225)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(255)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(285)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(315)"/>
    <path d="M0 0 L-26 -250 L26 -250 Z" transform="rotate(345)"/>
  </g>
  <g stroke="#141414" stroke-opacity="0.3" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(7.5)"/>

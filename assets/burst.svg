    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(277.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(292.5)"/>
    <line x1="0" y1="-150" x2="0" y2="-352" transform="rotate(307.5)"/>

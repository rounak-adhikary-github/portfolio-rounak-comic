<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Cheap newsprint paper grain">
  <title>Newsprint grain</title>
  <!-- Turbulence-based grain. stitchTiles keeps the tile seamless, so it can
       be layered over any flat colour to make it read as rough paper. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.42"/>
    </feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#grain)"/>
</svg>

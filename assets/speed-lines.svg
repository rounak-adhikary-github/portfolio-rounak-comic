<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="-540 -540 1080 1080" role="img" aria-label="Radial comic speed lines">
  <title>Radial speed lines</title>
  <!-- Comic "zoom in" lines. Transparent everywhere except the streaks, so it
       can be laid over a coloured panel with plain CSS and no blend tricks. -->
  <g stroke="#141414" stroke-width="5" stroke-linecap="round" stroke-opacity="0.32">
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(0)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(15)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(30)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(45)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(60)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(75)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(90)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(105)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(120)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(135)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(150)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(165)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(180)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(195)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(210)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(225)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(240)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(255)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(270)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(285)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(300)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(315)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(330)"/>
    <line x1="0" y1="-190" x2="0" y2="-540" transform="rotate(345)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-label="Comic badge: Rounak Adhikary, issue 7">
  <title>Comic badge</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset=".55" stop-color="#ffd400"/>
      <stop offset="1" stop-color="#f0a800"/>
    </linearGradient>
  </defs>

  <!-- the burst: two squares rotated 45° apart, the oldest comic-star trick there is -->
  <g stroke="#141414" stroke-width="9" stroke-linejoin="round">
    <rect x="58" y="58" width="244" height="244" fill="#e62429"/>
    <rect x="58" y="58" width="244" height="244" fill="url(#sheen)" transform="rotate(45 180 180)"/>
  </g>

  <!-- halftone shading in the lower right, the way a printed comic screens its ink -->
  <g clip-path="url(#dotclip)" fill="#141414" fill-opacity=".18">
    <circle cx="242" cy="242" r="4"/><circle cx="266" cy="242" r="4"/><circle cx="290" cy="242" r="4"/>
    <circle cx="242" cy="266" r="4"/><circle cx="266" cy="266" r="4"/><circle cx="290" cy="266" r="4"/>
    <circle cx="242" cy="290" r="4"/><circle cx="266" cy="290" r="4"/><circle cx="290" cy="290" r="4"/>
  </g>
  <clipPath id="dotclip"><rect x="58" y="58" width="244" height="244"/></clipPath>

  <!-- central disc with the monogram -->
  <circle cx="180" cy="172" r="104" fill="#fffdf6" stroke="#141414" stroke-width="9"/>
  <text x="180" y="215" text-anchor="middle" font-family="Impact, 'Arial Black', 'Arial Narrow Bold', sans-serif"
        font-size="124" font-weight="bold" fill="#141414" letter-spacing="2">RA</text>

  <!-- banner -->
  <g transform="rotate(-6 180 296)">
    <rect x="72" y="272" width="216" height="48" fill="#1d4fd8" stroke="#141414" stroke-width="7"/>
    <text x="180" y="304" text-anchor="middle" font-family="Impact, 'Arial Black', 'Arial Narrow Bold', sans-serif"
          font-size="27" fill="#fffdf6" letter-spacing="3">ISSUE #07</text>
  </g>

  <!-- lightning bolt, and a star to balance it -->
  <path d="M292 84 L272 126 L292 122 L270 176 L312 118 L290 122 L308 84 Z"
        fill="#ffd400" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
  <path d="M64 96 l10 22 l24 3 l-18 17 l5 24 l-21 -12 l-21 12 l5 -24 l-18 -17 l24 -3 Z"
        fill="#17b8d8" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
</svg>
